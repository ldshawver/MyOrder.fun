name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myorder_p0_owner_approval_ci
          POSTGRES_USER: myorder_ci
          POSTGRES_PASSWORD: myorder_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myorder_ci -d myorder_p0_owner_approval_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://myorder_ci:myorder_ci_only@localhost:5432/myorder_p0_owner_approval_ci
      MYORDER_OWNER_APPROVAL_DATABASE_URL: postgres://myorder_ci:myorder_ci_only@localhost:5432/myorder_p0_owner_approval_ci
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Rehearse P0 schema on PostgreSQL 16 through production migration 0067
        run: bash scripts/release/ci-p0-postgres-validation.sh
      - run: pnpm lint
      - run: pnpm lint:ratchet
      - run: pnpm --filter @workspace/scripts inventory:lockdown
      - run: pnpm test


  checkout-conversion-proof:
    name: checkout conversion proof artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/platform exec playwright install --with-deps chromium
      - name: Generate checkout conversion proof artifacts
        working-directory: artifacts/platform
        run: pnpm exec playwright test --config playwright.config.ts --no-deps e2e/checkout-conversion-proof.spec.ts --project=chromium
      - name: Upload checkout conversion proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-conversion-proof
          if-no-files-found: error
          path: |
            artifacts/platform/test-results/before-conversion-cart.png
            artifacts/platform/test-results/after-conversion-cart.png
            artifacts/platform/test-results/payment-disabled-before-conversion.png
            artifacts/platform/test-results/payment-enabled-after-conversion.png
            artifacts/platform/test-results/merchant-payload-proof.json
            artifacts/platform/playwright-report/
