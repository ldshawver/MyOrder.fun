name: Deploy to VPS

on:
  push:
    branches:
      - "release-tooling/**"
  workflow_dispatch:
    inputs:
      release_action:
        description: Run the guarded preflight, rerun only the isolated preserved-snapshot rehearsal, or deploy
        required: true
        type: choice
        options:
          - preflight
          - rehearsal
          - deploy
      production_confirmation:
        description: Type the exact protected confirmation for preflight, rehearsal, or deployment
        required: true
        type: string
      release_sha:
        description: Exact full commit SHA proposed for this release
        required: true
        type: string
      release_tree:
        description: Exact Git tree SHA corresponding to release_sha
        required: true
        type: string

concurrency:
  group: deploy-myorderfun
  cancel-in-progress: false

env:
  PINNED_RELEASE_SHA: 5c68c81600f31fd9781bcf2d47746d64b10ae81e
  PINNED_RELEASE_TREE: a765b25f0636a44d117353652ed82fd4316348c2

jobs:
  test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || '5c68c81600f31fd9781bcf2d47746d64b10ae81e' }}
      RELEASE_TREE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tree || 'a765b25f0636a44d117353652ed82fd4316348c2' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify frozen release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}"
          test "${RELEASE_SHA}" = "${PINNED_RELEASE_SHA}"
          test "${RELEASE_TREE}" = "${PINNED_RELEASE_TREE}"

      - name: Overlay deployment-only static assertions
        shell: bash
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:artifacts/api-server/src/routes/__tests__/myorder-pos-stabilization-static.test.ts" \
            > artifacts/api-server/src/routes/__tests__/myorder-pos-stabilization-static.test.ts
          git show "${GITHUB_SHA}:.github/workflows/deploy.yml" \
            > .github/workflows/deploy.yml
          git show "${GITHUB_SHA}:deploy/production-release.mjs" \
            > deploy/production-release.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint ratchet
        run: pnpm lint:ratchet

      - name: Run tests
        run: pnpm test

  release-tooling:
    name: Release controller tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployment tooling revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test guarded production release tooling
        run: node --test deploy/production-release.test.mjs deploy/safe-compose.test.mjs

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, release-tooling]
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha != '' && inputs.release_tree != '' && ((inputs.release_action == 'preflight' && inputs.production_confirmation == 'I_AUTHORIZE_PRODUCTION_PREFLIGHT') || (inputs.release_action == 'rehearsal' && inputs.production_confirmation == 'I_AUTHORIZE_PRODUCTION_RESTORE_REHEARSAL') || (inputs.release_action == 'deploy' && inputs.production_confirmation == 'I_AUTHORIZE_PRODUCTION_DEPLOYMENT')) }}

    permissions:
      contents: read
      packages: read

    env:
      VPS_TAILSCALE_HOST: 100.85.15.43

      # Used only to match the pre-pinned SSH host key; never used as a
      # network destination.
      VPS_SSH_HOST_KEY_ALIAS: ${{ secrets.VPS_HOST }}

      VPS_USER: ${{ secrets.VPS_USERNAME || secrets.VPS_USER || 'serveradmin' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      DEPLOY_PATH: /opt/alavont

      RELEASE_BASE_SHA: 583d556c8d3a5a094641ea229835d7c3397de1b1
      RELEASE_BASE_TREE: 5d28e84ac2cf71aa6c99f42b299fedfcde51079f
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_TREE: ${{ inputs.release_tree }}
      RELEASE_ACTION: ${{ inputs.release_action }}

      # The production database and current application containers belong to
      # the `deploy` project. Never create a second `alavont` stack: it has a
      # separate, empty database volume and would collide with the live nginx
      # loopback port.
      COMPOSE_PROJECT_NAME: deploy
      REPLACEMENT_API_REFERENCE: ghcr.io/ldshawver/myorder-api@sha256:7d51b579936c623cdf711c96001b707de561391ade3719a546ada0a0b4f8e791
      REPLACEMENT_MIGRATE_REFERENCE: ghcr.io/ldshawver/myorder-migrate@sha256:6f39211f7a0490141f1481c6ee8128c8985d55117384f9838059e954da9caafe
      REPLACEMENT_PLATFORM_REFERENCE: ghcr.io/ldshawver/myorder-platform@sha256:c1296e3484b9c5fcdf3f360bde7bae74a2a0f61c99125efede1a90a2d5188dd5

      VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Confirm deploy commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying SHA: ${RELEASE_SHA}"
          git log --oneline -n 1
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}"

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${VPS_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing VPS SSH private key. Add VPS_SSH_KEY in GitHub Secrets."
            exit 1
          fi

          printf '%s\n' "${VPS_PRIVATE_KEY}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key

          ssh-keygen -y -f ~/.ssh/vps_deploy_key > /dev/null
          echo "SSH_KEY_PATH=${HOME}/.ssh/vps_deploy_key" >> "$GITHUB_ENV"

      - name: Validate production Tailscale credentials
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${TS_OAUTH_CLIENT_ID:-}" || {
            echo "::error::Missing production environment secret TS_OAUTH_CLIENT_ID."
            exit 1
          }

          test -n "${TS_OAUTH_SECRET:-}" || {
            echo "::error::Missing production environment secret TS_OAUTH_SECRET."
            exit 1
          }

          test -n "${VPS_KNOWN_HOSTS:-}" || {
            echo "::error::Missing pinned SSH host keys in production environment secret VPS_KNOWN_HOSTS."
            exit 1
          }

          test -n "${VPS_SSH_HOST_KEY_ALIAS:-}" || {
            echo "::error::Missing known_hosts identity alias in production environment secret VPS_HOST."
            exit 1
          }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Verify Tailscale route to production SSH
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking the production SSH endpoint over Tailscale."

          for attempt in $(seq 1 12); do
            if nc -z -w 5 "${VPS_TAILSCALE_HOST}" "${VPS_PORT}"; then
              echo "Tailscale SSH route is reachable."
              exit 0
            fi

            echo "Tailscale SSH route not ready: ${attempt}/12"
            sleep 5
          done

          echo "::error::Production SSH is not reachable at the Tailscale address. Check the tagged CI grant and production Tailscale secrets."
          exit 1

      - name: Pin production SSH host identity and select Tailscale target
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -F "${VPS_SSH_HOST_KEY_ALIAS}" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::VPS_KNOWN_HOSTS must contain the pinned production host key for the VPS_HOST identity alias."
            exit 1
          fi

          echo "SELECTED_VPS_HOST=${VPS_TAILSCALE_HOST}" >> "$GITHUB_ENV"
          echo "SELECTED_VPS_PORT=${VPS_PORT}" >> "$GITHUB_ENV"

      - name: Verify SSH access
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "HostKeyAlias=${VPS_SSH_HOST_KEY_ALIAS}" \
            -o ConnectTimeout=20 \
            -p "${SELECTED_VPS_PORT}" \
            "${VPS_USER}@${SELECTED_VPS_HOST}" \
            'echo "SSH OK:" $(whoami)@$(hostname)'

      - name: Stage immutable replacement API, migrator and Platform images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "${GHCR_TOKEN}" | ssh \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "HostKeyAlias=${VPS_SSH_HOST_KEY_ALIAS}" \
            -p "${SELECTED_VPS_PORT}" \
            "${VPS_USER}@${SELECTED_VPS_HOST}" \
            "set -euo pipefail; \
             docker login ghcr.io --username '${GHCR_USER}' --password-stdin >/dev/null; \
             trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; \
             docker pull '${REPLACEMENT_API_REFERENCE}'; \
             api_id=\"\$(docker image inspect --format '{{.Id}}' '${REPLACEMENT_API_REFERENCE}')\"; \
             api_config=\"\$(docker manifest inspect '${REPLACEMENT_API_REFERENCE}' | node -p 'JSON.parse(require(\"fs\").readFileSync(0,\"utf8\")).config.digest')\"; \
             printf 'Pulled API manifest identity: %s; config identity: %s\\n' \"\$api_id\" \"\$api_config\"; \
             test \"\$api_id\" = 'sha256:7d51b579936c623cdf711c96001b707de561391ade3719a546ada0a0b4f8e791'; \
             test \"\$api_config\" = 'sha256:d64a1851542eab3c34058bd56f653e4075d737e9697689d90449317083706b50'; \
             docker pull '${REPLACEMENT_MIGRATE_REFERENCE}'; \
             migrate_id=\"\$(docker image inspect --format '{{.Id}}' '${REPLACEMENT_MIGRATE_REFERENCE}')\"; \
             migrate_config=\"\$(docker manifest inspect '${REPLACEMENT_MIGRATE_REFERENCE}' | node -p 'JSON.parse(require(\"fs\").readFileSync(0,\"utf8\")).config.digest')\"; \
             printf 'Pulled migrator manifest identity: %s; config identity: %s\\n' \"\$migrate_id\" \"\$migrate_config\"; \
             test \"\$migrate_id\" = 'sha256:6f39211f7a0490141f1481c6ee8128c8985d55117384f9838059e954da9caafe'; \
             test \"\$migrate_config\" = 'sha256:83be7e9e99886542163ee700868113071d7e16d817c934418c494bdb2e5f34ce'; \
             docker pull '${REPLACEMENT_PLATFORM_REFERENCE}'; \
             platform_id=\"\$(docker image inspect --format '{{.Id}}' '${REPLACEMENT_PLATFORM_REFERENCE}')\"; \
             platform_config=\"\$(docker manifest inspect '${REPLACEMENT_PLATFORM_REFERENCE}' | node -p 'JSON.parse(require(\"fs\").readFileSync(0,\"utf8\")).config.digest')\"; \
             printf 'Pulled Platform manifest identity: %s; config identity: %s\\n' \"\$platform_id\" \"\$platform_config\"; \
             test \"\$platform_id\" = 'sha256:c1296e3484b9c5fcdf3f360bde7bae74a2a0f61c99125efede1a90a2d5188dd5'; \
             test \"\$platform_config\" = 'sha256:22c258c07af018c6dd5c0571491afba3c2933ef2a01d2ffb2bf7b70c7304fb6f'; \
             for ref in '${REPLACEMENT_API_REFERENCE}' '${REPLACEMENT_MIGRATE_REFERENCE}' '${REPLACEMENT_PLATFORM_REFERENCE}'; do \
               test \"\$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \"\$ref\")\" = 'linux/amd64'; \
               docker image inspect --format '{{.Config.Labels}}' \"\$ref\" | grep -Fq 'org.opencontainers.image.revision:5c68c81600f31fd9781bcf2d47746d64b10ae81e'; \
               docker image inspect --format '{{.Config.Labels}}' \"\$ref\" | grep -Fq 'com.myorder.deploy-sha:5c68c81600f31fd9781bcf2d47746d64b10ae81e'; \
               docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \"\$ref\" | grep -Fx \"\$ref\" >/dev/null; \
             done"

      - name: Materialize reviewed deployment tooling
        env:
          TOOLING_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${TOOLING_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_SHA}" "${TOOLING_SHA}"

          TOOLING_ROOT="${RUNNER_TEMP}/production-tooling-${TOOLING_SHA}"
          test ! -e "${TOOLING_ROOT}"
          mkdir -m 700 "${TOOLING_ROOT}"
          git show "${TOOLING_SHA}:deploy/production-release.mjs" > "${TOOLING_ROOT}/production-release.mjs"
          git show "${TOOLING_SHA}:deploy/production-runtime-overlay.yml" > "${TOOLING_ROOT}/production-runtime-overlay.yml"
          test -s "${TOOLING_ROOT}/production-release.mjs"
          test -s "${TOOLING_ROOT}/production-runtime-overlay.yml"
          chmod 600 "${TOOLING_ROOT}/production-release.mjs" "${TOOLING_ROOT}/production-runtime-overlay.yml"
          TOOLING_CONTROLLER_SHA256="$(sha256sum "${TOOLING_ROOT}/production-release.mjs" | awk '{print $1}')"
          TOOLING_OVERLAY_SHA256="$(sha256sum "${TOOLING_ROOT}/production-runtime-overlay.yml" | awk '{print $1}')"
          echo "TOOLING_ROOT=${TOOLING_ROOT}" >> "$GITHUB_ENV"
          echo "TOOLING_CONTROLLER_SHA256=${TOOLING_CONTROLLER_SHA256}" >> "$GITHUB_ENV"
          echo "TOOLING_OVERLAY_SHA256=${TOOLING_OVERLAY_SHA256}" >> "$GITHUB_ENV"

      - name: Package the frozen application release
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse "${RELEASE_SHA}^{tree}")" = "${RELEASE_TREE}"
          test "$(git rev-parse "${RELEASE_BASE_SHA}^{tree}")" = "${RELEASE_BASE_TREE}"
          git merge-base --is-ancestor "${RELEASE_BASE_SHA}" "${RELEASE_SHA}"

          RELEASE_ARCHIVE="${RUNNER_TEMP}/myorder-release-${RELEASE_SHA}.tar.gz"
          RELEASE_TAR="${RUNNER_TEMP}/myorder-release-${RELEASE_SHA}.tar"

          git archive --format=tar "${RELEASE_SHA}" > "${RELEASE_TAR}"
          printf '{"baseSha":"%s","baseTree":"%s","sha":"%s","tree":"%s"}\n' \
            "${RELEASE_BASE_SHA}" "${RELEASE_BASE_TREE}" "${RELEASE_SHA}" "${RELEASE_TREE}" \
            > "${RUNNER_TEMP}/MYORDER-RELEASE-IDENTITY.json"

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${RELEASE_SHA}")"
          touch -d "@${SOURCE_DATE_EPOCH}" "${RUNNER_TEMP}/MYORDER-RELEASE-IDENTITY.json"
          chmod 0644 "${RUNNER_TEMP}/MYORDER-RELEASE-IDENTITY.json"

          tar --append --file "${RELEASE_TAR}" \
            --owner=0 --group=0 --numeric-owner \
            -C "${RUNNER_TEMP}" MYORDER-RELEASE-IDENTITY.json
          gzip -n -c "${RELEASE_TAR}" > "${RELEASE_ARCHIVE}"

          RELEASE_ARCHIVE_SHA256="$(sha256sum "${RELEASE_ARCHIVE}" | awk '{print $1}')"
          RELEASE_ARCHIVE_NAME="${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

          echo "RELEASE_ARCHIVE_SHA256=${RELEASE_ARCHIVE_SHA256}" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=${RELEASE_ARCHIVE}" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE_NAME=${RELEASE_ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Transfer immutable release and deployment controller
        env:
          TOOLING_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          TOOLING_TRANSFER_MODE="$(ssh \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "HostKeyAlias=${VPS_SSH_HOST_KEY_ALIAS}" \
            -p "${SELECTED_VPS_PORT}" \
            "${VPS_USER}@${SELECTED_VPS_HOST}" \
            "set -euo pipefail; \
             test -d '${DEPLOY_PATH}' && \
             test ! -L '${DEPLOY_PATH}'; \
             mkdir -p \
               '${DEPLOY_PATH}/incoming' \
               '${DEPLOY_PATH}/releases' \
               '${DEPLOY_PATH}/control/${TOOLING_SHA}' \
               '${DEPLOY_PATH}/shared'; \
             for p in \
               '${DEPLOY_PATH}/incoming' \
               '${DEPLOY_PATH}/releases' \
               '${DEPLOY_PATH}/control' \
               '${DEPLOY_PATH}/control/${TOOLING_SHA}' \
               '${DEPLOY_PATH}/shared'; \
             do \
               test -d \"\$p\" && test ! -L \"\$p\"; \
             done; \
             test ! -e '${DEPLOY_PATH}/incoming/${RELEASE_ARCHIVE_NAME}' && \
             test ! -L '${DEPLOY_PATH}/incoming/${RELEASE_ARCHIVE_NAME}'; \
             controller='${DEPLOY_PATH}/control/${TOOLING_SHA}/production-release.mjs'; \
             overlay='${DEPLOY_PATH}/control/${TOOLING_SHA}/production-runtime-overlay.yml'; \
             if test -e \"\$controller\" || test -L \"\$controller\" || \
                test -e \"\$overlay\" || test -L \"\$overlay\"; then \
               test -f \"\$controller\" && test ! -L \"\$controller\"; \
               test -f \"\$overlay\" && test ! -L \"\$overlay\"; \
               test \"\$(sha256sum \"\$controller\" | awk '{print \$1}')\" = '${TOOLING_CONTROLLER_SHA256}'; \
               test \"\$(sha256sum \"\$overlay\" | awk '{print \$1}')\" = '${TOOLING_OVERLAY_SHA256}'; \
               printf reuse; \
             else \
               printf install; \
             fi")"

          case "${TOOLING_TRANSFER_MODE}" in
            install|reuse) ;;
            *) echo "Refusing unknown tooling transfer mode" >&2; exit 1 ;;
          esac

          scp \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "HostKeyAlias=${VPS_SSH_HOST_KEY_ALIAS}" \
            -P "${SELECTED_VPS_PORT}" \
            "${RELEASE_ARCHIVE}" \
            "${VPS_USER}@${SELECTED_VPS_HOST}:${DEPLOY_PATH}/incoming/${RELEASE_ARCHIVE_NAME}"

          if [[ "${TOOLING_TRANSFER_MODE}" == "install" ]]; then
            scp \
              -i "$SSH_KEY_PATH" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "HostKeyAlias=${VPS_SSH_HOST_KEY_ALIAS}" \
              -P "${SELECTED_VPS_PORT}" \
              "${TOOLING_ROOT}/production-release.mjs" \
              "${TOOLING_ROOT}/production-runtime-overlay.yml" \
              "${VPS_USER}@${SELECTED_VPS_HOST}:${DEPLOY_PATH}/control/${TOOLING_SHA}/"
          else
            echo "Reusing hash-verified immutable deployment tooling for ${TOOLING_SHA}"
          fi

      - name: Execute guarded production release controller
        env:
          TOOLING_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_ACTION}" in
            preflight) CONTROLLER_CONFIRMATION=PREFLIGHT-PRODUCTION ;;
            rehearsal) CONTROLLER_CONFIRMATION=REHEARSE-PRODUCTION-SNAPSHOT ;;
            deploy) CONTROLLER_CONFIRMATION=DEPLOY-PRODUCTION ;;
            *) exit 1 ;;
          esac

          ssh \
            -i "$SSH_KEY_PATH" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "HostKeyAlias=${VPS_SSH_HOST_KEY_ALIAS}" \
            -p "${SELECTED_VPS_PORT}" \
            "${VPS_USER}@${SELECTED_VPS_HOST}" \
            "flock -n '${DEPLOY_PATH}/control/.production-deploy.lock' \
             env PRODUCTION_DEPLOY_CONFIRMATION='${CONTROLLER_CONFIRMATION}' \
             node '${DEPLOY_PATH}/control/${TOOLING_SHA}/production-release.mjs' \
             '${RELEASE_ACTION}' \
             --authorized \
             --base-sha '${RELEASE_BASE_SHA}' \
             --base-tree '${RELEASE_BASE_TREE}' \
             --release-sha '${RELEASE_SHA}' \
             --release-tree '${RELEASE_TREE}' \
             --archive '${DEPLOY_PATH}/incoming/${RELEASE_ARCHIVE_NAME}' \
             --archive-sha '${RELEASE_ARCHIVE_SHA256}' \
             --tooling-sha '${TOOLING_SHA}'"

      - name: Verify public site
        if: ${{ inputs.release_action == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 45); do
            HEALTH_JSON="$(
              curl \
                -fsS \
                --connect-timeout 10 \
                --max-time 20 \
                https://myorder.fun/api/healthz \
                || true
            )"

            HEALTH_SHA="$(
              node -e \
                'try {
                  process.stdout.write(
                    String(JSON.parse(process.argv[1]).sha || "")
                  );
                } catch {}' \
                "${HEALTH_JSON}"
            )"

            if [ "${HEALTH_SHA}" = "${RELEASE_SHA}" ]; then
              echo "Public health check passed with expected release SHA"
              exit 0
            fi

            echo "Public health not ready yet: ${i}/45"
            sleep 2
          done

          echo "::error::Public health check failed"
          exit 1
