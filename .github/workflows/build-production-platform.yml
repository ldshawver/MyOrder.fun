name: Build production Platform image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-platform:
    name: Build and verify production Platform image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SOURCE_SHA: 3e5a5c833b93c0e5c345cb2d2f2f9537400d16cb
      SOURCE_TREE: c2851c74077f94e189867b574a3f1aef244f61cc
      CLERK_PROXY_URL: https://myorder.fun/api/__clerk
      IMAGE_TAG: ghcr.io/ldshawver/myorder-platform:clerk-prod-3e5a5c833b93c0e5c345cb2d2f2f9537400d16cb-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout frozen Platform source
        uses: actions/checkout@v4
        with:
          ref: 3e5a5c833b93c0e5c345cb2d2f2f9537400d16cb
          fetch-depth: 1

      - name: Verify frozen source identity and production key
        env:
          PRODUCTION_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          node -e '
            const key = process.env.PRODUCTION_CLERK_PUBLISHABLE_KEY || "";
            if (!key.startsWith("pk_live_")) process.exit(1);
            const encoded = key.slice(8).replace(/\$$/, "");
            const domain = Buffer.from(encoded, "base64").toString("utf8").replace(/\0+$/, "");
            if (!domain.includes("clerk.myorder.fun")) process.exit(1);
          '

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable candidate image
        env:
          PRODUCTION_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          docker buildx build             --platform linux/amd64             --load             --build-arg "DEPLOY_SHA=$SOURCE_SHA"             --secret id=clerk_publishable_key,env=PRODUCTION_CLERK_PUBLISHABLE_KEY             --secret id=clerk_proxy_url,env=CLERK_PROXY_URL             --tag "$IMAGE_TAG"             --file deploy/Dockerfile.platform             .

      - name: Verify built browser bundle without revealing the key
        env:
          PRODUCTION_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          docker run --rm             --env PRODUCTION_CLERK_PUBLISHABLE_KEY             --entrypoint sh             "$IMAGE_TAG"             -eu -c '
              grep -RFl -- "$PRODUCTION_CLERK_PUBLISHABLE_KEY" /usr/share/nginx/html >/dev/null
              ! grep -Rqs "pk_test_" /usr/share/nginx/html
              grep -Rqs "https://myorder.fun/api/__clerk" /usr/share/nginx/html
            '
          echo "Verified: production publishable key is embedded, test keys are absent, and the expected Clerk proxy is embedded."

      - name: Publish image and report immutable digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_TAG" 2>&1 | tee "$RUNNER_TEMP/platform-push.log"
          DIGEST="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/platform-push.log" | tail -n 1)"
          test -n "$DIGEST"
          echo "Published image: ghcr.io/ldshawver/myorder-platform@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest is an input for a separate guarded release-tooling change. This workflow does not connect to or modify production."
