name: Build production candidate images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-candidate:
    name: Build and verify immutable production images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SOURCE_SHA: 008af2262096ac856af4a784d37404141b8e63c3
      SOURCE_TREE: 15a4be96caa10551cde96d1e02bd9a495b0e98cd
      CLERK_PROXY_URL: https://myorder.fun/api/__clerk
      API_IMAGE_TAG: ghcr.io/ldshawver/myorder-api:production-008af2262096ac856af4a784d37404141b8e63c3-${{ github.run_id }}-${{ github.run_attempt }}
      MIGRATE_IMAGE_TAG: ghcr.io/ldshawver/myorder-migrate:production-008af2262096ac856af4a784d37404141b8e63c3-${{ github.run_id }}-${{ github.run_attempt }}
      PLATFORM_IMAGE_TAG: ghcr.io/ldshawver/myorder-platform:production-008af2262096ac856af4a784d37404141b8e63c3-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout frozen candidate source
        uses: actions/checkout@v4
        with:
          ref: 008af2262096ac856af4a784d37404141b8e63c3
          fetch-depth: 1

      - name: Verify frozen source identity and production key
        env:
          PRODUCTION_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          node -e '
            const key = process.env.PRODUCTION_CLERK_PUBLISHABLE_KEY || "";
            if (!key.startsWith("pk_live_")) process.exit(1);
            const encoded = key.slice(8).replace(/\$$/, "");
            const domain = Buffer.from(encoded, "base64").toString("utf8").replace(/\0+$/, "");
            if (!domain.includes("clerk.myorder.fun")) process.exit(1);
          '

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable candidate images
        env:
          PRODUCTION_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg "DEPLOY_SHA=$SOURCE_SHA" \
            --tag "$API_IMAGE_TAG" \
            --file deploy/Dockerfile.api \
            .
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "com.myorder.deploy-sha=$SOURCE_SHA" \
            --tag "$MIGRATE_IMAGE_TAG" \
            --file deploy/Dockerfile.migrate \
            .
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --build-arg "DEPLOY_SHA=$SOURCE_SHA" \
            --secret id=clerk_publishable_key,env=PRODUCTION_CLERK_PUBLISHABLE_KEY \
            --secret id=clerk_proxy_url,env=CLERK_PROXY_URL \
            --tag "$PLATFORM_IMAGE_TAG" \
            --file deploy/Dockerfile.platform \
            .

      - name: Verify built browser bundle without revealing the key
        env:
          PRODUCTION_CLERK_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          docker run --rm \
            --env PRODUCTION_CLERK_PUBLISHABLE_KEY \
            --entrypoint sh \
            "$PLATFORM_IMAGE_TAG" \
            -eu -c '
              grep -RFl -- "$PRODUCTION_CLERK_PUBLISHABLE_KEY" /usr/share/nginx/html >/dev/null
              ! grep -Rqs "pk_test_" /usr/share/nginx/html
              grep -Rqs "https://myorder.fun/api/__clerk" /usr/share/nginx/html
            '
          echo "Verified: production publishable key is embedded, test keys are absent, and the expected Clerk proxy is embedded."

      - name: Verify image metadata
        run: |
          set -euo pipefail
          for image in "$API_IMAGE_TAG" "$MIGRATE_IMAGE_TAG" "$PLATFORM_IMAGE_TAG"; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/amd64"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$SOURCE_SHA"
            test "$(docker image inspect --format '{{index .Config.Labels "com.myorder.deploy-sha"}}' "$image")" = "$SOURCE_SHA"
          done

      - name: Publish images and report immutable digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for service in api migrate platform; do
            case "$service" in
              api) image="$API_IMAGE_TAG" ;;
              migrate) image="$MIGRATE_IMAGE_TAG" ;;
              platform) image="$PLATFORM_IMAGE_TAG" ;;
            esac
            docker push "$image" 2>&1 | tee "$RUNNER_TEMP/$service-push.log"
            digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/$service-push.log" | tail -n 1)"
            test -n "$digest"
            echo "${service}_image=ghcr.io/ldshawver/myorder-${service}@${digest}" >> "$GITHUB_STEP_SUMMARY"
            echo "${service}_config_id=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "These digests are inputs for a separate guarded release-tooling approval. This workflow does not connect to or modify production." >> "$GITHUB_STEP_SUMMARY"
