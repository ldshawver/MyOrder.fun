name: Build replacement API image

on:
  push:
    branches:
      - "release-tooling/40fcc-production-images"
    paths:
      - ".github/workflows/build-replacement-api.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build immutable replacement API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen replacement candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 3e5a5c833b93c0e5c345cb2d2f2f9537400d16cb

      - name: Verify replacement candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3e5a5c833b93c0e5c345cb2d2f2f9537400d16cb"
          test "$(git rev-parse HEAD^{tree})" = "c2851c74077f94e189867b574a3f1aef244f61cc"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish replacement API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ldshawver/myorder-api:replacement-3e5a5c833b93c0e5c345cb2d2f2f9537400d16cb
          build-args: |
            DEPLOY_SHA=3e5a5c833b93c0e5c345cb2d2f2f9537400d16cb
          cache-from: type=gha,scope=myorder-replacement-api
          cache-to: type=gha,mode=max,scope=myorder-replacement-api

      - name: Report immutable API digest
        run: |
          set -euo pipefail
          test -n "${{ steps.api.outputs.digest }}"
          echo "replacement_api_ref=ghcr.io/ldshawver/myorder-api@${{ steps.api.outputs.digest }}"
