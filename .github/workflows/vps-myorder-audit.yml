name: VPS MyOrder Audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/read-only-production-identity-20261110

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Inspect immutable production identities
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.85.15.43
          username: ${{ secrets.VPS_USERNAME || secrets.VPS_USER || 'serveradmin' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SECRET_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 120s
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            for service in api platform db nginx migrate; do
              container="$(docker ps -aq --filter "label=com.docker.compose.project=deploy" --filter "label=com.docker.compose.service=${service}" | head -n1)"
              test -n "${container}"
              docker inspect --format 'service={{ index .Config.Labels "com.docker.compose.service" }} image={{ .Config.Image }} image_id={{ .Image }} revision={{ index .Config.Labels "org.opencontainers.image.revision" }} running={{ .State.Running }}' "${container}"
            done
