name: VPS MyOrder Audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/read-only-production-identity-20261110

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Install pinned production SSH identity
        shell: bash
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SECRET_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${VPS_PRIVATE_KEY}" > ~/.ssh/vps_audit_key
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps_audit_key ~/.ssh/known_hosts

      - name: Inspect immutable production identities
        shell: bash
        env:
          VPS_USER: ${{ secrets.VPS_USERNAME || secrets.VPS_USER || 'serveradmin' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_HOST_ALIAS: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_audit_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "HostKeyAlias=${VPS_HOST_ALIAS}" \
            -o ConnectTimeout=20 -p "${VPS_PORT}" "${VPS_USER}@100.85.15.43" \
            'set -euo pipefail; for service in api platform db nginx migrate; do container="$(docker ps -aq --filter "label=com.docker.compose.project=deploy" --filter "label=com.docker.compose.service=${service}" | head -n1)"; test -n "${container}"; docker inspect --format '\''service={{ index .Config.Labels "com.docker.compose.service" }} image={{ .Config.Image }} image_id={{ .Image }} revision={{ index .Config.Labels "org.opencontainers.image.revision" }} running={{ .State.Running }}'\'' "${container}"; done'
